name: Build and deploy

# Rebuilds on every push, and twice a day so new events appear and finished ones drop off.
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 4,15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails the run if every event source is unreachable, so the last good site stays up.
      - run: npm run fetch
      - run: npm run build
      # Keep the event data in the repo: it is the site's history, and the commits stop
      # GitHub from switching off this schedule after 60 days without activity.
      - name: Save event data
        if: github.event_name != 'push'
        run: |
          # ignore runs where only the "fetchedAt" time moved
          if git diff --quiet -I'"fetchedAt"' -- src/data; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update event data" -- src/data
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
