# The groups listed on yorkdevelopers.org. To add yours, add an entry and open a pull request.
#
#   id       short name, also what people type into the filter
#   name     display name
#   about    one line on what the group is for
#   url      where to find the group
#   meetup   the group's address on meetup.com (the bit after meetup.com/); events are read from it daily
#   match    only needed when several groups share one Meetup page: words that appear in this group's event titles
#   tags     extra words the filter on the home page should find this group's events by
#   runs     how often it meets
#   retired  true for groups that have closed
#
# Whether a group shows as active or "no events scheduled" is worked out from its feed.

- id: accu
  name: ACCU York
  about: Professionalism in programming, any language
  url: https://www.meetup.com/accu-york/
  meetup: accu-york
  tags: c++ cpp programming software craft
  runs: monthly

